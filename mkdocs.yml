# Docs site: the docs/ vault rendered with MkDocs Material.
# Published under /docs/ of the GitHub Pages demo by .github/workflows/pages-demo.yml;
# CI builds it with --strict on every pull request.
#
#   pip install -e ".[docs]"
#   mkdocs serve                  # http://127.0.0.1:8000
#
# See docs/Specs & ADRs/Docs Site - 2026-10-19.md

site_name: Testosterone
site_description: See what broke, what's flaky and what got slower on every run. Test history, run-to-run diffs and flaky detection for any test runner.
site_url: https://taltal-beep.github.io/testosterone/docs/
repo_url: https://github.com/taltal-beep/testosterone
repo_name: taltal-beep/testosterone
edit_uri: edit/main/docs/

docs_dir: docs
exclude_docs: |
  .obsidian/
not_in_nav: |
  Archive/*.md

hooks:
  - scripts/mkdocs_hooks.py

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-style anchors (no collapsing of "--"), so links written for
      # GitHub and Obsidian resolve here too.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/taltal-beep/testosterone
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/testo-core/

