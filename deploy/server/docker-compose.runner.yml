# Opt-in: run each stage of a server-started run in a fresh, throwaway container.
#
#   export TESTO_RUNNER_TOKEN="$(openssl rand -hex 32)"
#   export DOCKER_GID="$(stat -c %g /var/run/docker.sock)"
#   docker compose -f docker-compose.yml -f docker-compose.runner.yml up -d
#
# Only the `runner` service can reach Docker; the API (`server`) never gets the
# socket. Each stage container gets the repos and artifacts volumes, the stage's
# own variables (never the server's token or database URL), no capabilities and
# a process limit. Uploads from CI (`testo ingest`) don't use it at all.
# Guide: docs/Processes & Guides/Team Server.md#runs-in-throwaway-containers
services:
  server:
    environment:
      TESTO_RUNNER: container
      TESTO_RUNNER_URL: http://runner:8790
      TESTO_RUNNER_TOKEN: ${TESTO_RUNNER_TOKEN:?set TESTO_RUNNER_TOKEN (e.g. openssl rand -hex 32)}
    volumes:
      # Same paths in the server and in every stage container.
      - testo_repos:/repos
      - testo_artifacts:/data/artifacts
    depends_on:
      runner:
        condition: service_healthy

  runner:
    image: ghcr.io/taltal-beep/testo-runner-service:${TESTO_SERVER_TAG:-1}
    build:
      context: ../..
      dockerfile: Dockerfile.testo-runner-service
    environment:
      TESTO_RUNNER_TOKEN: ${TESTO_RUNNER_TOKEN:?set TESTO_RUNNER_TOKEN (e.g. openssl rand -hex 32)}
      # Volume names as the Docker daemon knows them (fixed with `name:` below).
      TESTO_RUNNER_MOUNTS: testo_repos:/repos,testo_artifacts:/data/artifacts
      # The image stages run in: the testo-runner image, or your own built FROM it.
      TESTO_RUNNER_IMAGE: ${TESTO_RUNNER_IMAGE:-ghcr.io/taltal-beep/testo-runner:1}
      TESTO_RUNNER_MEMORY: ${TESTO_RUNNER_MEMORY:-}
      TESTO_RUNNER_CPUS: ${TESTO_RUNNER_CPUS:-}
      # `none` cuts stages off the network entirely.
      TESTO_RUNNER_NETWORK: ${TESTO_RUNNER_NETWORK:-}
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the group id of /var/run/docker.sock}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # No ports: only the server reaches it, over the compose network.
    restart: unless-stopped

volumes:
  testo_repos:
    name: testo_repos
  testo_artifacts:
    name: testo_artifacts
