name: Publish pytest-testo to PyPI

# pytest-testo (integrations/pytest-testo/) only depends on testo-core, so it is
# released by hand when its own version changes, not on every testo-core release.
# Trusted publishing: PyPI needs a (pending) publisher for project pytest-testo,
# repository taltal-beep/testosterone, workflow publish-pytest-testo.yml,
# environment pypi.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    name: Publish pytest-testo
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: integrations/pytest-testo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Install it with testo-core from PyPI and run pytest --testo
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          mkdir -p /tmp/smoke-project
          printf 'def test_ok():\n    assert True\n' > /tmp/smoke-project/test_ok.py
          cd /tmp/smoke-project
          /tmp/smoke/bin/pytest -q --testo | tee out.txt
          grep -q "testo: recorded" out.txt

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: integrations/pytest-testo/dist
