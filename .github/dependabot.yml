# Weekly update PRs, grouped so each ecosystem opens at most one PR a week.
# Major versions are left out of the groups and arrive as separate PRs.
# Commit messages follow Conventional Commits (commitlint), and the
# no-changelog label satisfies ci.yml's changelog_required job.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "no-changelog"]
    groups:
      python:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "no-changelog"]
    groups:
      frontend:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node major CI builds with (actions/setup-node
      # node-version: "22"); move both together, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "no-changelog"]
    groups:
      tooling:
        update-types: [minor, patch]
  # Both copies of the composite action: the root action.yml (Marketplace) and
  # integrations/github-action/action.yml. tests/contract/ci/test_action_copies.py
  # fails if they differ, so they must be bumped in the same PR.
  - package-ecosystem: github-actions
    directories: ["/", "/integrations/github-action"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "no-changelog"]
    groups:
      actions:
        patterns: ["*"]
