[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pytest-testo"
version = "1.0.0"
description = "pytest --testo: record every pytest run and see what broke, what's flaky and what got slower (installs testo-core)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Taltal" }]
keywords = ["pytest", "flaky-tests", "test-history", "test-reporting", "junit"]
# The plugin itself ships in testo-core (entry point pytest11 "testo"), so this
# package registers no entry point of its own: registering the same module twice
# would make pytest refuse to start.
dependencies = [
    "pytest>=7",
    "testo-core>=1.4.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/taltal-beep/testosterone"
Documentation = "https://taltal-beep.github.io/testosterone/docs/cli-commands/command-reference/#pytest-testo"
Source = "https://github.com/taltal-beep/testosterone/tree/main/integrations/pytest-testo"
Issues = "https://github.com/taltal-beep/testosterone/issues"

[tool.hatch.build.targets.wheel]
packages = ["pytest_testo"]
