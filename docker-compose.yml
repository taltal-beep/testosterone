services:
  postgres:
    image: postgres:16-alpine
    container_name: testo-postgres
    ports:
      # PostgreSQL on this machine only (its password is the default below)
      - "127.0.0.1:5432:5432"
    environment:
      # Default DB credentials (change for production)
      POSTGRES_USER: testo_admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: testo_history
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - uqo-net

networks:
  uqo-net:
    name: uqo-net
    driver: bridge

volumes:
  postgres_data:
