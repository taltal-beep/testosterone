services:
  postgres:
    image: postgres:15-alpine
    container_name: uqo-postgres
    ports:
      # PostgreSQL (DB) exposed on host for local tools
      - "5432:5432"
    environment:
      # Default DB credentials (change for production)
      POSTGRES_USER: uqo_admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: uqo_history
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - uqo-net

networks:
  uqo-net:
    name: uqo-net
    driver: bridge

volumes:
  postgres_data:
